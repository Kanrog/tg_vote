<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG26 Kinotider</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .schedule-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 30px;
            padding: 12px 24px;
            background: var(--primary-color);
            color: var(--text-color);
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: var(--hover-color);
            transform: translateY(-2px);
        }

        .schedule-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .schedule-header h1 {
            font-size: 3em;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .schedule-date {
            font-size: 1.2em;
            color: var(--accent-color);
        }

        .schedule-timeline {
            position: relative;
        }

        .schedule-item {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .schedule-item:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 12px rgba(229, 9, 20, 0.4);
        }

        .schedule-time {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary-color);
            min-width: 120px;
            text-align: center;
        }

        .schedule-details {
            flex: 1;
        }

        .schedule-movie-title {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .schedule-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            color: #999;
        }

        .schedule-info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .schedule-location {
            background: var(--primary-color);
            color: var(--text-color);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.2em;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #f44336;
            font-size: 1.2em;
        }

        .empty-schedule {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-schedule h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .refresh-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary-color);
            color: var(--text-color);
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1em;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .refresh-button:hover {
            background: var(--hover-color);
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .schedule-header h1 {
                font-size: 2em;
            }

            .schedule-item {
                flex-direction: column;
                text-align: center;
            }

            .schedule-time {
                min-width: auto;
            }

            .schedule-info {
                justify-content: center;
            }
        }
    

               /* Language Selector */
               .language-selector {
                   display: flex;
                   gap: 5px;
                   justify-content: center;
                   margin-bottom: 20px;
               }

               .lang-btn {
                   background: rgba(255, 255, 255, 0.1);
                   border: 2px solid rgba(255, 255, 255, 0.3);
                   color: white;
                   padding: 8px 12px;
                   border-radius: 8px;
                   cursor: pointer;
                   font-size: 14px;
                   transition: all 0.3s ease;
                   backdrop-filter: blur(10px);
               }

               .lang-btn:hover {
                   background: rgba(255, 255, 255, 0.2);
                   border-color: rgba(255, 255, 255, 0.5);
                   transform: translateY(-2px);
               }

               .lang-btn.active {
                   background: var(--primary-color, #ea7b31);
                   border-color: var(--primary-color, #ea7b31);
                   box-shadow: 0 4px 8px rgba(234, 123, 49, 0.3);
               }</style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
    <div class="schedule-container">
        <div class="language-selector">
    <button class="lang-btn active" data-lang="no">🇳🇴 NO</button>
    <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
</div>

<div style="text-align: center; margin-bottom: 20px;">
    <img src="logo transparent.png" alt="TG26 Arena Logo" style="max-height: 200px; margin: 15px 0;">
</div>

<a href="index.html" class="back-button" data-i18n="backToVoting">← Tilbake</a>
        <div class="schedule-header">
            <h1 data-i18n="scheduleTitle">🎬 TG26 Kinotider</h1>
            <p class="schedule-date" id="scheduleDate">Laster...</p>
        </div>

        <div id="scheduleContent" class="loading">
            <span data-i18n="loadingTimes">Laster tider...</span>
        </div>

        <button class="refresh-button" onclick="loadSchedule()">🔄 Oppdater</button>
    </div>

    <script>
           // Translation system
           const translations = {
               no: {
                   backToVoting: "← Tilbake til avstemning",
                   scheduleTitle: "🎬 TG26 Kinotider",
                   loadingTimes: "Laster tider...",
                   loadingSchedule: "Laster timeplan...",
                   refreshSchedule: "🔄 Oppdater",
                   noMoviesScheduled: "Ingen filmer planlagt ennå",
                   noMoviesScheduledText: "Timeplanen vil vises her når den er satt opp.",
                   unableToLoadSchedule: "Kan ikke laste timeplan",
                   unableToLoadScheduleText: "Sjekk at Google Sheet er offentlig tilgjengelig.",
                   todayDate: "Dato"
               },
               en: {
                   backToVoting: "← Back to Voting",
                   scheduleTitle: "🎬 TG26 Movie Schedule",
                   loadingTimes: "Loading schedule...",
                   loadingSchedule: "Loading schedule...",
                   refreshSchedule: "🔄 Refresh",
                   noMoviesScheduled: "No Movies Scheduled Yet",
                   noMoviesScheduledText: "The schedule will appear here once it's been set up.",
                   unableToLoadSchedule: "Unable to Load Schedule",
                   unableToLoadScheduleText: "Please check that the Google Sheet is publicly accessible.",
                   todayDate: "Date"
               }
           };

           let currentLang = localStorage.getItem('language') || 'no';

           // Language switching
           function switchLanguage(lang) {
               currentLang = lang;
               localStorage.setItem('language', lang);
               
               // Update button states
               document.querySelectorAll('.lang-btn').forEach(btn => {
                   btn.classList.toggle('active', btn.dataset.lang === lang);
               });
               
               // Update all elements with data-i18n attribute
               document.querySelectorAll('[data-i18n]').forEach(element => {
                   const key = element.getAttribute('data-i18n');
                   if (translations[lang][key]) {
                       element.textContent = translations[lang][key];
                   }
               });
               
               // Refresh schedule to update dynamic content
               if (typeof loadSchedule === 'function') {
                   loadSchedule();
               }
           }


        // CONFIGURATION - Replace with your Google Sheet ID
        const GOOGLE_SHEET_ID = '16wHVW-MeOC2cM5caZae4ocQkgW147k8fURJE1o3QRjI';
        const SHEET_NAME = 'Schedule'; // Name of the sheet tab
        
        // Auto-refresh every 30 seconds
        let autoRefreshInterval;

        // Load schedule on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadSchedule();
            startAutoRefresh();
            updateDate(); // This is now async
               
               // Initialize language system
               switchLanguage(currentLang);
               
               // Add language switcher event listeners
               document.querySelectorAll('.lang-btn').forEach(btn => {
                   btn.addEventListener('click', () => {
                       switchLanguage(btn.dataset.lang);
                   });
               });
        });

        // Update current date
async function updateDate() {
    const dateElement = document.getElementById('scheduleDate');
    
        try {
            // Load the sheet data to get the custom date from F2
            const csvUrl = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;
            const response = await fetch(csvUrl);
            const csvText = await response.text();
            const lines = csvText.split('\n').filter(line => line.trim());
            
            if (lines.length >= 2) {
                // Get row 2 (index 1) and column F (index 5)
                const secondRow = parseCSVLine(lines[1]);
                const customDate = secondRow[5] ? secondRow[5].replace(/"/g, '').trim() : 'Schedule Date';
                dateElement.textContent = customDate;
            } else {
                dateElement.textContent = 'Schedule Date';
            }
        } catch (error) {
            console.error('Error loading custom date:', error);
            dateElement.textContent = 'Schedule Date';
        }

}


        // Load schedule from Google Sheets
        async function loadSchedule() {
            const contentDiv = document.getElementById('scheduleContent');
            contentDiv.innerHTML = '<div class="loading">Loading schedule...</div>';

            try {
                // Construct CSV export URL
                const csvUrl = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;
                
                const response = await fetch(csvUrl);
                if (!response.ok) {
                    throw new Error('Failed to load schedule');
                }

                const csvText = await response.text();
                const scheduleData = parseCSV(csvText);
                
                if (scheduleData.length === 0) {
                    contentDiv.innerHTML = `
                        <div class="empty-schedule">
                            <h2>No Movies Scheduled Yet</h2>
                            <p>The schedule will appear here once it's been set up.</p>
                        </div>
                    `;
                    return;
                }

                displaySchedule(scheduleData);
            } catch (error) {
                console.error('Error loading schedule:', error);
                contentDiv.innerHTML = `
                    <div class="error">
                        <h2>Unable to Load Schedule</h2>
                        <p>Please check that the Google Sheet is publicly accessible.</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        // Parse CSV data
        function parseCSV(csvText) {
            const lines = csvText.split('\n').filter(line => line.trim());
            if (lines.length <= 1) return []; // Only header or empty

            const schedule = [];
            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                if (values.length >= 2 && values[0] && values[1]) {
                    schedule.push({
                        time: values[0].replace(/"/g, '').trim(),
                        title: values[1].replace(/"/g, '').trim(),
                        duration: values[2] ? values[2].replace(/"/g, '').trim() : '',
                        location: values[3] ? values[3].replace(/"/g, '').trim() : ''
                    });
                }
            }
            return schedule;
        }

        // Parse a single CSV line (handles quoted commas)
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];

                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }

            result.push(current.trim());
            return result;
        }

        // Display schedule
        function displaySchedule(scheduleData) {
            const contentDiv = document.getElementById('scheduleContent');
            
            const html = scheduleData.map(item => `
                <div class="schedule-item">
                    <div class="schedule-time">${item.time}</div>
                    <div class="schedule-details">
                        <div class="schedule-movie-title">${item.title}</div>
                        <div class="schedule-info">
                            ${item.duration ? `<div class="schedule-info-item">⏱️ ${item.duration}</div>` : ''}
                            ${item.location ? `<div class="schedule-location">${item.location}</div>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');

            contentDiv.innerHTML = `<div class="schedule-timeline">${html}</div>`;
        }

        // Start auto-refresh
        function startAutoRefresh() {
            autoRefreshInterval = setInterval(() => {
                loadSchedule();
            }, 30000); // Refresh every 30 seconds
        }

        // Stop auto-refresh (if needed)
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        }
    </script>
</body>
</html>
